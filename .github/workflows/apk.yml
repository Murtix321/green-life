name: APK derle

on:
  push:
    branches: [main]
    paths: ['lib/**', 'test/**', 'assets/**', 'pubspec.yaml', 'analysis_options.yaml', 'tool/patch_android.py', 'tool/debug.keystore', '.github/workflows/apk.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.24.5
          cache: true

      - name: Ücretsiz veri API'lerini kontrol et
        continue-on-error: true
        run: |
          python3 - <<'PY'
          import json, urllib.request
          H = {'User-Agent': 'GreenLife-CI'}
          def get(u):
              return json.load(urllib.request.urlopen(urllib.request.Request(u, headers=H), timeout=20))
          checks = {
              'iNaturalist': lambda: (lambda t: (t['name'], t.get('preferred_common_name')))(get('https://api.inaturalist.org/v1/taxa?q=Monstera%20deliciosa&taxon_id=47126&locale=tr&per_page=1')['results'][0]),
              'Arama (lavanta)': lambda: [(x['name'], x.get('preferred_common_name'), x['rank']) for x in get('https://api.inaturalist.org/v1/taxa/autocomplete?q=lavanta&taxon_id=47126&locale=tr&per_page=3')['results']],
              'Vikipedi (Deve tabanı)': lambda: get('https://tr.wikipedia.org/api/rest_v1/page/summary/Deve_taban%C4%B1?redirect=true').get('extract', '')[:120],
              'Vikipedi (Lavanta)': lambda: get('https://tr.wikipedia.org/api/rest_v1/page/summary/Lavanta?redirect=true').get('extract', '')[:120],
              'Wikipedia EN': lambda: get('https://en.wikipedia.org/api/rest_v1/page/summary/Monstera_deliciosa').get('extract', '')[:80],
              'Open-Meteo': lambda: (lambda m: (m['current'], m['daily']))(get('https://api.open-meteo.com/v1/forecast?latitude=41.01&longitude=28.97&current=temperature_2m,relative_humidity_2m&daily=temperature_2m_max&timezone=auto&forecast_days=1')),
              'Şehir': lambda: (lambda g: (g['name'], g['latitude'], g['longitude']))(get('https://geocoding-api.open-meteo.com/v1/search?name=Ankara&count=1&language=tr')['results'][0]),
          }
          for k, f in checks.items():
              try:
                  print('APICHECK', k, '->', f())
              except Exception as e:
                  print('APICHECK', k, '-> HATA', e)
          PY

      - name: Android dosyalarını oluştur
        run: flutter create --org com.greenlife --project-name green_life --platforms=android .

      - name: Alarm / izin ayarlarını ekle
        run: python3 tool/patch_android.py

      - run: flutter pub get

      - name: Kod analizi
        run: flutter analyze --no-fatal-infos

      - name: Birim ve widget testleri
        run: flutter test

      - name: İmza parmak izi (Google girişi için)
        run: keytool -list -v -keystore tool/debug.keystore -storepass android -alias androiddebugkey | grep -E "SHA1|SHA256"

      - name: APK derle
        env:
          PLANTNET_KEY: ${{ secrets.PLANTNET_KEY }}
          PERENUAL_KEY: ${{ secrets.PERENUAL_KEY }}
        run: |
          flutter build apk --release \
            --dart-define=PLANTNET_KEY="$PLANTNET_KEY" \
            --dart-define=PERENUAL_KEY="$PERENUAL_KEY"
          cp build/app/outputs/flutter-apk/app-release.apk GreenLife.apk

      - uses: actions/upload-artifact@v4
        with:
          name: GreenLife-apk
          path: GreenLife.apk

      - name: İndirme sayfası (Release)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: deneme-${{ github.run_number }}
          name: Green Life deneme ${{ github.run_number }}
          body: Telefona indirip kur. Bilinmeyen kaynaklardan yüklemeye izin vermen gerekebilir.
          files: GreenLife.apk
