name: Bitki fotoğraflarını indir

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['tool/fetch_photos.py']

permissions:
  contents: write

jobs:
  photos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tool/fetch_photos.py
      - name: Depoya kaydet
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add design-assets/photos
          git diff --cached --quiet || git commit -m "Gerçek bitki fotoğrafları (iNaturalist, serbest lisans)"
          git push
